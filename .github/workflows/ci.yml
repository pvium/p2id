name: CI

# Runs on pushes to develop, and on PRs, but only when something a job tests changed;
# docs, the spec and the other workflows skip CI. `changes` then narrows further so each job runs
# only for its own paths. Keep the two path lists identical.
on:
  push:
    branches: [develop]
    paths:
      - 'circuit/**'
      - 'contracts/**'
      - 'http-prover/**'
      - 'sdks/node/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'circuit/**'
      - 'contracts/**'
      - 'http-prover/**'
      - 'sdks/node/**'
      - '.github/workflows/ci.yml'

# Pull requests from forks get no secrets; nothing here needs any.
permissions:
  contents: read

env:
  NARGO_VERSION: 1.0.0-beta.26
  BB_VERSION: 5.0.0

defaults:
  run:
    shell: bash

# Run test stages in order and stop after a failure. Path-filtered skips are allowed.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      sdk: ${{ steps.filter.outputs.sdk }}
      circuit: ${{ steps.filter.outputs.circuit }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            contracts:
              - *workflow
              - 'contracts/**'
            # p2id-core ships contracts/src at build time (sync-contracts.sh).
            sdk:
              - *workflow
              - 'sdks/node/**'
              - 'contracts/src/**'
            circuit:
              - *workflow
              - 'circuit/**'
              - 'http-prover/**'
              - 'sdks/node/**'

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: yarn,
            cache-dependency-path: contracts/yarn.lock,
          }
      - run: yarn install --frozen-lockfile
      - run: yarn test

  sdk:
    needs: [changes, contracts]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.sdk == 'true' &&
          (needs.contracts.result == 'success' || needs.contracts.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdks/node } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: yarn,
            cache-dependency-path: sdks/node/yarn.lock,
          }
      - run: yarn install --frozen-lockfile
      - run: yarn test

  # Compiles the circuit (cached by source hash), then runs the Noir unit, e2e and adversarial
  # suites and the prover's full proving test. Only worth the minutes when the circuit or the
  # prover changed.
  circuit-and-prover:
    needs: [changes, contracts, sdk]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.circuit == 'true' &&
          (needs.contracts.result == 'success' || needs.contracts.result == 'skipped') &&
          (needs.sdk.result == 'success' || needs.sdk.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nargo and bb
        run: |
          curl -fsSL https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          ~/.nargo/bin/noirup -v $NARGO_VERSION
          curl -fsSL https://raw.githubusercontent.com/AztecProtocol/aztec-packages/master/barretenberg/bbup/install | bash
          ~/.bb/bbup -v $BB_VERSION
          echo "$HOME/.nargo/bin" >> $GITHUB_PATH
          echo "$HOME/.bb" >> $GITHUB_PATH
      - name: Cache compiled circuit
        id: circuit-cache
        uses: actions/cache@v4
        with:
          path: |
            circuit/target/pvium_identity.json
            circuit/target/proof_email
          key: circuit-${{ env.NARGO_VERSION }}-${{ env.BB_VERSION }}-${{ hashFiles('circuit/src/**', 'circuit/Nargo.toml', 'circuit/version.json') }}
      - name: Compile circuit and prove the sample
        if: steps.circuit-cache.outputs.cache-hit != 'true'
        working-directory: circuit
        run: |
          nargo compile
          python3 scripts/gen_prover.py --jwt "$(cat test/fixtures/sample_token.jwt)" --pubkey test/fixtures/privy_es256_public.pem \
            --type email --value test-9988@privy.io --wallet 0xA01b6E60D51eDB3fEB9f86a62b846f4F90070f98 -o Prover.toml
          nargo execute sample_email
          bb prove -b target/pvium_identity.json -w target/sample_email.gz -t evm --write_vk --verify -o target/proof_email
      - name: Check version.json matches the built vk
        working-directory: circuit
        run: |
          actual="0x$(sha256sum target/proof_email/vk | cut -d' ' -f1)"
          expected=$(python3 -c "import json;print(json.load(open('version.json'))['vkSha256'])")
          [ "$actual" = "$expected" ] || { echo "vk hash $actual != version.json $expected: bump circuit/version.json"; exit 1; }
      - name: Noir unit, e2e and adversarial tests
        working-directory: circuit
        run: |
          nargo test
          sh test/e2e.sh
          sh test/adversarial.sh
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the SDKs (the prover's tests verify through @pvium/p2id-verifier)
        working-directory: sdks/node
        run: yarn install --frozen-lockfile && yarn workspace @pvium/p2id-verifier sync && yarn build
      - name: Prover tests, including a real proof
        working-directory: http-prover
        run: yarn install --frozen-lockfile && yarn sync && yarn test
