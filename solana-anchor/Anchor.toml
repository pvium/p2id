[toolchain]
anchor_version = "1.1.2"
solana_version = "3.1.10"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
p2id_policy = "7Pk7qV1WMJn5iN4mfS1eKJxJgzWska4Uk8X1nej8A2VX"
p2id_router = "2zhNs3tEhpreRbmb98icGSwDuom6i2JWDbid9Ur6P4QH"
p2id_solana_verifier = "7DoBQ1FcAXB8rf3PVXo5gikJCw4mamQswKXDeVE8rBYu"
p2id_vault = "HeCmyjbG5nVMY2msxiUkfhf8WqPMEVqh7gR1nFEmAfdt"
test_hook = "ETVm4N6WjGkF8NVT8NYJvY54zKqaNuR1EPupuYrJvSV9"
test_verifier = "CBpmjvYYEQnMkp6HeQxG5GdJXDXkZHmqb6MRFZEQpnsg"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run test"

# Load the programs with the provider wallet as upgrade authority (a genesis-loaded program has an
# unusable authority nobody can burn); the suite then finalizes the ones the factory references, as a
# real deployment must before `initialize_factory` / `register_implementation` / `activate_verifier`.
[test]
upgradeable = true

[hooks]

