# Build-time inputs. `P2ID_ZK_VERIFIER` is the proof-system program (the Sunspot-generated Groth16
# verifier) that `p2id_solana_verifier` fronts; this value is the local test backend, which accepts
# every proof. A real build sets it in the environment, which takes precedence over this file:
#   P2ID_ZK_VERIFIER=<sunspot program id> anchor build -p p2id_solana_verifier
[env]
P2ID_ZK_VERIFIER = "CBpmjvYYEQnMkp6HeQxG5GdJXDXkZHmqb6MRFZEQpnsg"
