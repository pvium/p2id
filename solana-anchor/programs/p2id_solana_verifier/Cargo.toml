[package]
name = "p2id_solana_verifier"
version = "0.1.0"
description = "P2ID verifier for circuit v2: implements the verifier interface in front of a Sunspot-generated Groth16 verifier"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p2id_solana_verifier"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "p2id_verifier_interface/idl-build"]

[dependencies]
anchor-lang = "=1.1.2"
p2id_verifier_interface = { path = "../../crates/p2id_verifier_interface" }
