[package]
name = "p2id_solana_verifier"
version = "0.1.0"
description = "Anchor CPI wrapper for Sunspot-generated P2ID verifiers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p2id_solana_verifier"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.1.2"
