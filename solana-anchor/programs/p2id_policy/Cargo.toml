[package]
name = "p2id_policy"
version = "0.1.0"
description = "P2ID fee policy: quotes the fee rate to vaults and books the fees they deliver (EVM PviumP2IDPolicy)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p2id_policy"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", features = ["token", "associated_token"] }
