[package]
name = "p2id_vault"
version = "0.1.0"
description = "P2ID vault implementation v1: verifies identity proofs and drives the router (EVM P2IDVaultV2)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p2id_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", features = ["token", "associated_token"] }
p2id_router = { path = "../p2id_router", features = ["cpi"] }
