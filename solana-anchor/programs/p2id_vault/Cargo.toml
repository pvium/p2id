[package]
name = "p2id_vault"
version = "0.1.0"
description = "Deterministic P2ID vault factory with pinned Sunspot verifiers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p2id_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", features = ["token", "associated_token"] }
sha2 = "0.10"
