[package]
name = "test_hook"
version = "0.1.0"
description = "Test-only Token-2022 transfer hook that counts transfers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "test_hook"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
spl-discriminator = "0.5.2"
spl-tlv-account-resolution = "0.11.4"
spl-transfer-hook-interface = "2.1.0"
